

services: 
  db:
    image: postgres:16
    container_name: text2sql-postgres
    # database: text2sql_db
    environment:
      POSTGRES_USER: text2sql_user
      POSTGRES_PASSWORD: text2sql_password
      POSTGRES_DB: text2sql_db
    ports:
      - "5432:5432"
    volumes:
      - text2sql_postgres_data:/var/lib/postgresql/data

volumes:
  text2sql_postgres_data: 